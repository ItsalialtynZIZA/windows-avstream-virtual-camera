name: AvCam Bridge App (Windows x64)
on:
  workflow_dispatch:
  push:
    branches:
      - dev/manual-vhci
    paths:
      - 'research/udecx/tools/AvCamUdeObsFeeder.cpp'
      - 'research/udecx/tools/AvCamPreview.cpp'
      - 'research/udecx/tools/README_AVCAM_PREVIEW.txt'
      - 'research/udecx/tools/AvCamUdeMjpegEncoder.cpp'
      - 'research/udecx/tools/README_AVCAM_BRIDGE.txt'
      - 'research/udecx/tests/CMakeLists.txt'
      - 'feeder/src/MediaFoundationFrameSource.cpp'
      - 'feeder/src/MediaFoundationFrameSource.h'
      - 'feeder/src/DirectShowObsSource.cpp'
      - 'feeder/src/DirectShowObsSource.h'
      - 'feeder/src/MediaFoundationDeviceSelector.h'
      - 'research/udecx/AvCamUdeUploadProtocol.h'
      - '.github/workflows/avcam-bridge.yml'
permissions:
  contents: read
jobs:
  bridge-app:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone Windows AvCam Bridge (no driver)
        shell: pwsh
        run: |
          cmake -S research/udecx/tests -B build/avcam-bridge -A x64
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }
          cmake --build build/avcam-bridge --config Release --target AvCamUdeObsFeeder AvCamPreview
          if ($LASTEXITCODE -ne 0) { throw 'AvCam Bridge or Preview compilation failed' }
          if (-not (Test-Path 'build/avcam-bridge/Release/AvCamPreview.exe')) { throw 'AvCam Preview executable missing' }
      - name: Validate application CLI without accessing camera or kernel
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'build/avcam-bridge/Release/AvCamUdeObsFeeder.exe').ProviderPath
          $usage = & $exe --help
          $exit = $LASTEXITCODE
          $usage | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0 -or -not ($usage | Select-String -- '--continuous')) {
            throw 'Continuous bridge CLI unavailable'
          }
          & $exe --frames 10 --continuous
          if ($LASTEXITCODE -ne 2) { throw 'Conflicting frame modes were not rejected' }
          & $exe --source-usb-id NOT_A_USB_ID
          if ($LASTEXITCODE -ne 2) { throw 'Unvalidated device identity accepted' }
          Write-Host 'AVCAM_BRIDGE_CLI_PASSED'
          exit 0
      - name: Package app only, excluding all drivers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'dist/AvCam-Bridge-x64'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Copy-Item 'build/avcam-bridge/Release/AvCamUdeObsFeeder.exe' $dir
          Copy-Item 'build/avcam-bridge/Release/AvCamPreview.exe' $dir
          Copy-Item 'research/udecx/tools/README_AVCAM_PREVIEW.txt' $dir
          Copy-Item 'research/udecx/tools/README_AVCAM_BRIDGE.txt' $dir
          $hash = (Get-FileHash "$dir/AvCamUdeObsFeeder.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $previewHash = (Get-FileHash "$dir/AvCamPreview.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$hash  AvCamUdeObsFeeder.exe", "$previewHash  AvCamPreview.exe") |
            Set-Content "$dir/SHA256SUMS.txt" -Encoding Ascii
          $files = @(Get-ChildItem $dir -File)
          if ($files.Count -ne 5 -or
              @($files | Where-Object { $_.Extension -match '(?i)^\.(sys|inf|cat|cer|dll|ps1)$' }).Count -gt 0) {
            throw 'Unexpected files in user-mode-only app archive'
          }
          Write-Host "AVCAM_BRIDGE_SHA256=$hash"
          Write-Host "AVCAM_PREVIEW_SHA256=$previewHash"
          Write-Host 'AVCAM_BRIDGE_USER_MODE_PACKAGE_VALIDATED'
      - uses: actions/upload-artifact@v4
        with:
          name: AvCam-Bridge-Windows-x64
          path: dist/AvCam-Bridge-x64/
          retention-days: 14
          if-no-files-found: error

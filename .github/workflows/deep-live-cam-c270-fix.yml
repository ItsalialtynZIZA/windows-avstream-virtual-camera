name: Deep Live Cam C270 preview-only prototype build
on:
  workflow_dispatch:
  push:
    branches: [dev/manual-vhci]
    paths:
      - "research/deep-live-cam-c270/**"
      - ".github/workflows/deep-live-cam-c270-fix.yml"
permissions:
  contents: read
concurrency:
  group: dlc-c270-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-c270:
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - name: Checkout AvCam capture patch
        uses: actions/checkout@v4
      - name: Checkout exact Deep Live Cam 2.2.4 upstream source
        uses: actions/checkout@v4
        with:
          repository: CRSD-Lau/deep-live-cam
          ref: 617c733d42a10a2fcba036385e19d66fabcc2cc1
          path: upstream
          persist-credentials: false
      - name: Install CPython 3.11.9 for pinned Windows build
        uses: actions/setup-python@v5
        with:
          python-version: 3.11.9
          architecture: x64
      - name: Expand and verify reviewed capture module
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $patch = Get-Content research/deep-live-cam-c270/video_capture.py.gz.b64 -Raw
          $bytes = [Convert]::FromBase64String($patch.Trim())
          $stream = New-Object System.IO.MemoryStream(,$bytes)
          try {
            $gzip = New-Object System.IO.Compression.GZipStream($stream,[IO.Compression.CompressionMode]::Decompress)
            try {
              $out = New-Object System.IO.MemoryStream
              $gzip.CopyTo($out)
              $target = Join-Path $PWD 'upstream/modules/video_capture.py'
              [IO.File]::WriteAllBytes($target,$out.ToArray())
            } finally { $gzip.Dispose() }
          } finally { $stream.Dispose() }
          $hash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
          if ($hash -ine 'D23262CF628A6EB6F90685397DECE848ED682E0330BC985B938E63396583DF9B') {
            throw "Video capturer module hash mismatch: $hash"
          }
          python -m py_compile "$target"
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed' }
          Write-Host 'DLC_C270_FALLBACK_SOURCE_SHA256_VERIFIED'
      - name: Apply reviewed preview-only producer and slow-camera fallback patch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $encoded = Get-Content research/deep-live-cam-c270/C270PrototypePatch.py.gz.b64 -Raw
          $compressed = [Convert]::FromBase64String($encoded.Trim())
          $stream = New-Object System.IO.MemoryStream(,$compressed)
          try {
            $gzip = New-Object System.IO.Compression.GZipStream($stream,[IO.Compression.CompressionMode]::Decompress)
            try {
              $out = New-Object System.IO.MemoryStream
              $gzip.CopyTo($out)
              $script = Join-Path $PWD 'C270PrototypePatch.py'
              [IO.File]::WriteAllBytes($script,$out.ToArray())
            } finally { $gzip.Dispose() }
          } finally { $stream.Dispose() }
          $hash = (Get-FileHash -LiteralPath $script -Algorithm SHA256).Hash
          if ($hash -ine 'BFC829D98A8CEF8C7C3A0D73882DB2582540E80CEA7A901CEFA128BB0A867A42') {
            throw "Prototype patch integrity mismatch: $hash"
          }
          python C270PrototypePatch.py upstream
          if ($LASTEXITCODE -ne 0) { throw 'Preview-only producer patch failed' }
          python -m py_compile upstream/modules/video_capture.py upstream/modules/ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Patched source failed syntax validation' }
          Write-Host 'DLC_PREVIEW_ONLY_SINGLE_PRODUCER_PATCH_VERIFIED'
      - name: Build independent CUDA executable bundle from locked upstream dependencies
        shell: powershell
        working-directory: upstream
        run: |
          $ErrorActionPreference = 'Stop'
          & .\build\windows\build_windows.ps1 -Python (Get-Command python).Source -Accelerator Cuda
          if ($LASTEXITCODE -ne 0) { throw 'Windows Deep Live Cam build failed' }
          if (-not (Test-Path .\dist\DeepLiveCamStudio\DeepLiveCamStudio.exe)) {
            throw 'Expected patched Windows executable is missing'
          }
      - name: Build lightweight EXE-only patch for existing 2.2.4 CUDA installation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'upstream\\dist\\DeepLiveCamStudio'
          $out = Join-Path $PWD 'overlay'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          foreach ($exe in @('DeepLiveCamStudio.exe','DeepLiveCamStudioCLI.exe')) {
            Copy-Item -LiteralPath (Join-Path $dist $exe) -Destination $out -Force
            Write-Host ("PATCHED {0} bytes={1}" -f $exe,(Get-Item (Join-Path $out $exe)).Length)
          }
          foreach ($name in @('Install-C270Hotfix.ps1','Install-C270Hotfix.cmd','Restore-C270Hotfix.cmd')) {
            Copy-Item (Join-Path 'research/deep-live-cam-c270' $name) -Destination $out -Force
          }
          Copy-Item research/deep-live-cam-c270/C270_OVERLAY_README.txt -Destination (Join-Path $out 'C270_OVERLAY_README.txt')
          Copy-Item upstream/modules/video_capture.py -Destination (Join-Path $out 'C270_Patched_VideoCapture.py.txt')
          Copy-Item upstream/modules/ui.py -Destination (Join-Path $out 'C270_Patched_UI.py.txt')
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory(
            $out,(Join-Path $PWD 'DeepLiveCam-C270-OBS-PreviewOnly-PROTOTYPE.zip'),
            [IO.Compression.CompressionLevel]::Optimal,$false)
          Write-Host 'DLC_C270_OBS_PREVIEW_ONLY_PROTOTYPE_PACKAGE_READY'
      - name: Upload preview-only compact executable patch
        uses: actions/upload-artifact@v4
        with:
          name: DeepLiveCam-C270-OBS-PreviewOnly-PROTOTYPE
          path: DeepLiveCam-C270-OBS-PreviewOnly-PROTOTYPE.zip
          retention-days: 7
          if-no-files-found: error

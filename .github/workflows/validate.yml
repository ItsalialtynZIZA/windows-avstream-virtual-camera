name: Validate

on:
  push:
  pull_request:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feeder:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure feeder
        run: cmake -S feeder -B build/feeder -A x64

      - name: Build feeder
        run: cmake --build build/feeder --config Release

      - name: Show feeder result
        shell: pwsh
        run: Get-ChildItem build/feeder -Recurse -Filter AvCamFeeder.exe

  driver:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore WDK package cache
        id: wdk-cache
        uses: actions/cache/restore@v4
        with:
          path: packages
          key: wdk-sdk-x64-10.0.26100.6584

      - name: Restore WDK and SDK packages
        run: nuget restore packages.config -PackagesDirectory packages -NonInteractive

      - name: Save WDK package cache
        if: steps.wdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages
          key: wdk-sdk-x64-10.0.26100.6584

      - name: Locate WDK build tools
        shell: pwsh
        run: |
          $stampInf = Get-ChildItem packages -Recurse -Filter stampinf.exe -File |
            Where-Object { $_.FullName -match '\\x64\\stampinf\.exe$' } |
            Select-Object -First 1
          if (-not $stampInf) { throw 'x64 stampinf.exe was not found in restored WDK packages.' }

          $x64ToolDir = $stampInf.Directory.FullName
          $binRoot = Split-Path $x64ToolDir -Parent
          $infVerifDll = Join-Path $binRoot 'x86\InfVerif.dll'

          if (-not (Test-Path $infVerifDll)) {
            throw "Expected InfVerif.dll was not found: $infVerifDll"
          }

          Write-Host "x64 stampinf.exe: $($stampInf.FullName)"
          Write-Host "WDK bin root: $binRoot"
          Write-Host "InfVerif.dll: $infVerifDll"

          "StampInfToolPath=$x64ToolDir\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WDKBinRoot=$binRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $x64ToolDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build AVStream driver
        shell: pwsh
        run: |
          Push-Location $env:WDKBinRoot
          try {
            msbuild "$env:GITHUB_WORKSPACE\driver\AvCam.vcxproj" /m /p:Configuration=Release /p:Platform=x64
          }
          finally {
            Pop-Location
          }

      - name: Show driver outputs
        shell: pwsh
        run: Get-ChildItem driver -Recurse -Include AvCam.sys,AvCam.inf,AvCam.cat

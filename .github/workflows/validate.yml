name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - dev/manual-vhci

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feeder:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure feeder
        run: cmake -S feeder -B build/feeder -A x64

      - name: Build feeder
        run: cmake --build build/feeder --config Release

      - name: Show feeder result
        shell: pwsh
        run: Get-ChildItem build/feeder -Recurse -Filter AvCamFeeder.exe

      - name: Upload feeder executable
        uses: actions/upload-artifact@v4
        with:
          name: AvCamFeeder-x64
          if-no-files-found: error
          path: build/feeder/Release/AvCamFeeder.exe

  driver:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell helper syntax
        shell: pwsh
        run: |
          $scripts = Get-ChildItem scripts -Filter '*.ps1' -File
          if (-not $scripts) { throw 'No PowerShell helper scripts were found.' }
          foreach ($script in $scripts) {
            try {
              [void][scriptblock]::Create((Get-Content $script.FullName -Raw))
              Write-Host "Syntax OK: $($script.FullName)"
            }
            catch {
              throw "PowerShell syntax validation failed for '$($script.FullName)': $($_.Exception.Message)"
            }
          }

      - name: Check AvCam KS interface registration contract
        shell: pwsh
        run: |
          $filter = Get-Content driver/AvCamFilter.cpp -Raw
          $inf = Get-Content driver/AvCam.inf -Raw
          $protocol = Get-Content shared/VirtualCameraProtocol.h -Raw
          foreach ($category in @('KSCATEGORY_VIDEO_CAMERA','KSCATEGORY_VIDEO','KSCATEGORY_CAPTURE','GUID_DEVINTERFACE_AVCAM_FRAME_SINK')) {
            if (!$filter.Contains($category)) { throw "Missing KS filter category: $category" }
          }
          if ($inf -notmatch '(?m)^AddInterface\s*=\s*%AVCAM_FRAME_SINK%') { throw 'Private sink interface missing from INF' }
          if ($inf -notmatch '(?m)^AVCAM_FRAME_SINK\s*=\s*"\{7B28304F-6B89-4DF0-9E54-B048F4A16213\}"') { throw 'Private sink GUID mismatch in INF' }
          if (!$protocol.Contains('0x7b28304f, 0x6b89, 0x4df0')) { throw 'Private sink GUID mismatch in shared protocol' }
          Write-Host 'AVCAM_KS_INTERFACE_REGISTRATION_CONTRACT_PASS'

      - name: Add x64 MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Restore WDK package cache
        id: wdk-cache
        uses: actions/cache/restore@v4
        with:
          path: packages
          key: wdk-sdk-x64-10.0.26100.6584-v2

      - name: Restore WDK and SDK packages
        run: nuget restore packages.config -PackagesDirectory packages -NonInteractive

      - name: Save WDK package cache
        if: steps.wdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages
          key: wdk-sdk-x64-10.0.26100.6584-v2

      - name: Locate WDK build tools
        shell: pwsh
        run: |
          $stampInf = Get-ChildItem packages -Recurse -Filter stampinf.exe -File |
            Where-Object { $_.FullName -match '\\x64\\stampinf\.exe$' } |
            Select-Object -First 1
          if (-not $stampInf) { throw 'x64 stampinf.exe was not found in restored WDK packages.' }

          $infVerifDll = Get-ChildItem packages -Recurse -Filter InfVerif.dll -File |
            Where-Object { $_.FullName -match '\\build\\[^\\]+\\bin\\x64\\InfVerif\.dll$' } |
            Select-Object -First 1

          $targetToolDir = $stampInf.Directory.FullName
          if ($infVerifDll) {
            $targetToolDir = $infVerifDll.Directory.FullName
            $stagedStampInf = Join-Path $targetToolDir 'stampinf.exe'
            Copy-Item $stampInf.FullName $stagedStampInf -Force
            Write-Host "Staged stampinf.exe: $stagedStampInf"
            Write-Host "InfVerif.dll: $($infVerifDll.FullName)"
          }

          Write-Host "stampinf.exe: $($stampInf.FullName)"
          Write-Host "WDK tool directory: $targetToolDir"

          "StampInfToolPath=$targetToolDir\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $targetToolDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build AVStream driver
        shell: pwsh
        run: msbuild driver/AvCam.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:StampInfToolPath="$env:StampInfToolPath"

      - name: Build DevCon-free AvCam root camera installer (no device changes)
        shell: pwsh
        run: |
          cmake -S tools/avcam-root-install -B build/avcam-root-install -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Root installer configure failed' }
          cmake --build build/avcam-root-install --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Root installer compile failed' }
          $installer = 'build/avcam-root-install/Release/AvCamRootInstall.exe'
          & $installer --selftest
          if ($LASTEXITCODE -ne 0) { throw 'Root installer no-device selftest failed' }
          $dest = 'driver/x64/Release/AvCam'
          if (!(Test-Path -LiteralPath (Join-Path $dest 'AvCam.inf'))) {
            throw 'Driver package output directory missing'
          }
          Copy-Item -LiteralPath $installer -Destination $dest
          Write-Host 'AVCAM_ROOT_INSTALLER_PACKAGED_NO_DEVCON_PASS'

      - name: Show driver outputs
        shell: pwsh
        run: Get-ChildItem driver -Recurse -Include AvCam.sys,AvCam.inf,AvCam.cat,AvCam.cer,AvCamRootInstall.exe

      - name: Upload test-signed driver package
        uses: actions/upload-artifact@v4
        with:
          name: AvCam-test-package-x64
          if-no-files-found: error
          path: |
            driver/x64/Release/AvCam/**
            driver/x64/Release/AvCam.cer
            scripts/install-test-package.ps1
            scripts/install-driver.ps1
            scripts/uninstall-driver.ps1
            scripts/verify-camera.ps1
            scripts/runtime-smoke-check.ps1
            scripts/driver-verifier.ps1
            scripts/enable-test-signing.ps1
            scripts/disable-test-signing.ps1
            docs/local-test.md
            docs/hardening.md
            docs/production-signing.md

      - name: Analyze AVStream driver with PREfast
        shell: pwsh
        run: |
          $output = & msbuild driver/AvCam.vcxproj /t:Rebuild /m /p:Configuration=Release /p:Platform=x64 /p:StampInfToolPath="$env:StampInfToolPath" /p:RunCodeAnalysis=true /p:EnablePREfast=true 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }

          if ($exitCode -ne 0) {
            throw "PREfast MSBuild failed with exit code $exitCode."
          }

          $warnings = @($output | Select-String -Pattern '\bwarning\s+(C|CA|MSB)\d{4,5}\s*:' -CaseSensitive:$false)
          if ($warnings.Count -gt 0) {
            Write-Host 'PREfast warnings detected:'
            $warnings | ForEach-Object { Write-Host $_.Line }
            throw "PREfast emitted $($warnings.Count) warning(s)."
          }

          Write-Host 'PREfast completed with zero detected warnings.'

  runtime-bundle:
    needs:
      - driver
      - feeder
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Download driver artifact
        uses: actions/download-artifact@v4
        with:
          name: AvCam-test-package-x64
          path: runtime/driver

      - name: Download feeder artifact
        uses: actions/download-artifact@v4
        with:
          name: AvCamFeeder-x64
          path: runtime/feeder

      - name: Prepare integrated prototype launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime | Out-Null
          Copy-Item integration/START_AVCAM.cmd runtime/START_AVCAM.cmd -Force
          Copy-Item integration/CHECK_AVCAM_INSTALL.ps1 runtime/CHECK_AVCAM_INSTALL.ps1 -Force
          @'
          AVCAM INTEGRATED PROTOTYPE (EXPERIMENTAL)
          1. OBS Studio: set up a scene and click Start Virtual Camera.
          2. If a compatible AvCam AVStream test driver is already installed, run START_AVCAM.cmd.
          3. Open Windows Camera or Chrome, and select AvCam Virtual Camera.
          4. Stop with Ctrl+C. Do not install test drivers on a production Windows system.
          WARNING: The driver in driver/ is test-signed, may require Windows Test Mode,
          and has NOT been validated end-to-end with this feeder. It is NOT auto-installed.
          The Deep Live Cam app remains separate and is never modified by this bundle.
          '@ | Set-Content -Path runtime/README-FIRST.txt -Encoding UTF8

      - name: Show runtime bundle contents
        shell: pwsh
        run: Get-ChildItem runtime -Recurse | Select-Object FullName, Length

      - name: Upload combined runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: AvCam-runtime-test-x64
          if-no-files-found: error
          path: runtime/**

name: Validate

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feeder:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure feeder
        run: cmake -S feeder -B build/feeder -A x64

      - name: Build feeder
        run: cmake --build build/feeder --config Release

      - name: Show feeder result
        shell: pwsh
        run: Get-ChildItem build/feeder -Recurse -Filter AvCamFeeder.exe

  driver:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Add x64 MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Restore WDK package cache
        id: wdk-cache
        uses: actions/cache/restore@v4
        with:
          path: packages
          key: wdk-sdk-x64-10.0.26100.6584

      - name: Restore WDK and SDK packages
        run: nuget restore packages.config -PackagesDirectory packages -NonInteractive

      - name: Save WDK package cache
        if: steps.wdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages
          key: wdk-sdk-x64-10.0.26100.6584

      - name: Locate WDK build tools
        shell: pwsh
        run: |
          $stampInf = Get-ChildItem packages -Recurse -Filter stampinf.exe -File |
            Where-Object { $_.FullName -match '\\x64\\stampinf\.exe$' } |
            Select-Object -First 1
          if (-not $stampInf) { throw 'x64 stampinf.exe was not found in restored WDK packages.' }

          $infVerifDll = Get-ChildItem packages -Recurse -Filter InfVerif.dll -File |
            Where-Object { $_.FullName -match '\\build\\[^\\]+\\bin\\x64\\InfVerif\.dll$' } |
            Select-Object -First 1
          if (-not $infVerifDll) { throw 'x64 InfVerif.dll was not found in restored WDK packages.' }

          $x64ToolDir = $stampInf.Directory.FullName
          $infVerifX64Dir = $infVerifDll.Directory.FullName
          $infVerifRoot = Split-Path $infVerifX64Dir -Parent
          $expectedStampInf = Join-Path $infVerifX64Dir 'stampinf.exe'

          Copy-Item $stampInf.FullName $expectedStampInf -Force
          if (-not (Test-Path $expectedStampInf)) {
            throw "stampinf.exe staging failed: $expectedStampInf"
          }

          Write-Host "Source stampinf.exe: $($stampInf.FullName)"
          Write-Host "Staged stampinf.exe: $expectedStampInf"
          Write-Host "x64 InfVerif.dll: $($infVerifDll.FullName)"
          Write-Host "InfVerif root: $infVerifRoot"

          "StampInfToolPath=$infVerifX64Dir\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WDKBinRoot=$infVerifRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $infVerifX64Dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build AVStream driver
        shell: pwsh
        run: |
          Push-Location $env:WDKBinRoot
          try {
            msbuild "$env:GITHUB_WORKSPACE\driver\AvCam.vcxproj" /m /p:Configuration=Release /p:Platform=x64 /p:StampInfToolPath="$env:StampInfToolPath"
          }
          finally {
            Pop-Location
          }

      - name: Show driver outputs
        shell: pwsh
        run: Get-ChildItem driver -Recurse -Include AvCam.sys,AvCam.inf,AvCam.cat

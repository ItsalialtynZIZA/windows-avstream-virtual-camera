name: Validate

on:
  push:
  pull_request:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feeder:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure feeder
        run: cmake -S feeder -B build/feeder -A x64

      - name: Build feeder
        run: cmake --build build/feeder --config Release

      - name: Show feeder result
        shell: pwsh
        run: Get-ChildItem build/feeder -Recurse -Filter AvCamFeeder.exe

  driver:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore WDK package cache
        id: wdk-cache
        uses: actions/cache/restore@v4
        with:
          path: packages
          key: wdk-sdk-x64-10.0.26100.6584

      - name: Restore WDK and SDK packages
        run: nuget restore packages.config -PackagesDirectory packages -NonInteractive

      - name: Save WDK package cache
        if: steps.wdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages
          key: wdk-sdk-x64-10.0.26100.6584

      - name: Locate WDK build tools
        shell: pwsh
        run: |
          $stampInf = Get-ChildItem packages -Recurse -Filter stampinf.exe -File | Select-Object -First 1
          if (-not $stampInf) { throw 'stampinf.exe was not found in restored WDK packages.' }
          $toolDir = $stampInf.Directory.FullName
          Write-Host "stampinf.exe: $($stampInf.FullName)"
          "StampInfToolPath=$toolDir\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $toolDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build AVStream driver
        run: msbuild driver/AvCam.vcxproj /m /p:Configuration=Release /p:Platform=x64

      - name: Show driver outputs
        shell: pwsh
        run: Get-ChildItem driver -Recurse -Include AvCam.sys,AvCam.inf,AvCam.cat

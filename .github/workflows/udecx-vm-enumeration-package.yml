name: AvCam UdeCx VM Enumeration Package (test signed)
on:
  push:
    branches:
      - dev/manual-vhci
    paths:
      - 'research/udecx/AvCamUde.c'
      - 'research/udecx/AvCamUdeUsb.c'
      - 'research/udecx/AvCamUdeUsb.h'
      - 'research/udecx/AvCamUdeTestIdentity.h'
      - 'research/udecx/AvCamUde.vcxproj'
      - 'research/udecx/AvCamUde.inf'
      - 'research/udecx/tools/AvCamUdeVmRootInstall.cpp'
      - 'research/udecx/tools/AvCamUdeVmPreflight.ps1'
      - 'research/udecx/tools/AvCamUdeVmEnumerationReport.ps1'
      - 'research/udecx/tools/README_VM_ENUMERATION.txt'
      - 'research/udecx/tests/CMakeLists.txt'
      - '.github/workflows/udecx-vm-enumeration-package.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: udecx-vm-only-packaging
  cancel-in-progress: true
jobs:
  vm-only-package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify explicit USB enumeration safety contract
        shell: pwsh
        run: ./research/udecx/tests/static-contract.ps1
      - name: Restore WDK package cache
        uses: actions/cache/restore@v4
        with:
          path: packages
          key: wdk-sdk-x64-10.0.26100.6584-v2
      - name: Restore Windows WDK and SDK
        shell: pwsh
        run: |
          nuget restore packages.config -PackagesDirectory packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'WDK and SDK package restore failed' }
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Locate WDK StampInf and INF verification tools
        shell: pwsh
        run: |
          $stampInf = Get-ChildItem packages -Recurse -Filter stampinf.exe -File | Where-Object { $_.FullName -match '\\x64\\stampinf\.exe$' } | Select-Object -First 1
          if (-not $stampInf) { throw 'WDK x64 StampInf missing' }
          $infDll = Get-ChildItem packages -Recurse -Filter InfVerif.dll -File | Where-Object { $_.FullName -match '\\build\\[^\\]+\\bin\\x64\\InfVerif\.dll$' } | Select-Object -First 1
          $toolDir = $stampInf.Directory.FullName
          if ($infDll) {
            $toolDir = $infDll.Directory.FullName
            Copy-Item $stampInf.FullName (Join-Path $toolDir 'stampinf.exe') -Force
          }
          "StampInfToolPath=$toolDir\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $toolDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build isolated enumeration-only UdeCx driver (no installation)
        shell: pwsh
        run: |
          msbuild research/udecx/AvCamUde.vcxproj /t:Rebuild /m /p:Configuration=Release /p:Platform=x64 /p:StampInfToolPath="$env:StampInfToolPath" /p:AvCamUdeVmEnumerationTest=I_UNDERSTAND_DISPOSABLE_VM_ONLY
          if ($LASTEXITCODE -ne 0) { throw 'VM-only UdeCx build failed' }
          Write-Host 'UDECX_VM_ONLY_SIGNED_BUILD_COMPLETED'
      - name: Build VM-only SetupAPI root installer (never execute)
        shell: pwsh
        run: |
          cmake -S research/udecx/tests -B build/udecx-vm-installer -A x64
          if ($LASTEXITCODE -ne 0) { throw 'VM installer CMake configuration failed' }
          cmake --build build/udecx-vm-installer --config Release --target AvCamUdeVmRootInstall
          if ($LASTEXITCODE -ne 0) { throw 'VM installer MSVC build failed' }
      - name: Validate test-signed package and file integrity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'research/udecx/x64/Release/AvCamUde'
          $sys = Join-Path $root 'AvCamUde.sys'
          $inf = Join-Path $root 'AvCamUde.inf'
          $cat = Join-Path $root 'avcamude.cat'
          foreach ($file in @($sys, $inf, $cat)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "WDK output missing: $file" }
          }
          $infText = Get-Content -LiteralPath $inf -Raw
          if ($infText -notmatch 'Root\\AvCamUdeController' -or $infText -match 'Root\\AvCamVirtualUsbHost') {
            throw 'INF must exclusively match the isolated new research root.'
          }
          $sysSign = Get-AuthenticodeSignature -LiteralPath $sys
          $catSign = Get-AuthenticodeSignature -LiteralPath $cat
          if (-not $sysSign.SignerCertificate -or -not $catSign.SignerCertificate -or $sysSign.SignerCertificate.Thumbprint -ne $catSign.SignerCertificate.Thumbprint) {
            throw 'SYS and CAT must carry the same test-signing certificate.'
          }
          $dest = 'dist/AvCam-UdeCx-VM-Enumeration-ONLY'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item $sys $dest
          Copy-Item $inf $dest
          Copy-Item $cat $dest
          Copy-Item 'build/udecx-vm-installer/Release/AvCamUdeVmRootInstall.exe' $dest
          Copy-Item 'research/udecx/tools/AvCamUdeVmPreflight.ps1' $dest
          Copy-Item 'research/udecx/tools/AvCamUdeVmEnumerationReport.ps1' $dest
          Copy-Item 'research/udecx/tools/README_VM_ENUMERATION.txt' $dest
          Export-Certificate -Cert $sysSign.SignerCertificate -FilePath (Join-Path $dest 'AvCamUdeVmTestSigner.cer') | Out-Null
          $names = @('AvCamUde.sys','AvCamUde.inf','avcamude.cat','AvCamUdeVmRootInstall.exe','AvCamUdeVmPreflight.ps1','AvCamUdeVmEnumerationReport.ps1','README_VM_ENUMERATION.txt','AvCamUdeVmTestSigner.cer')
          $files = @(Get-ChildItem -LiteralPath $dest -File)
          if ($files.Count -ne $names.Count) { throw 'Unexpected VM package file count.' }
          foreach ($file in $files) {
            if ($file.Name -notin $names) { throw "Unexpected file: $($file.Name)" }
          }
          $checksums = foreach ($file in $files) {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $file.Name
          }
          $checksums | Set-Content -LiteralPath (Join-Path $dest 'SHA256SUMS.txt') -Encoding ascii
          Write-Host "UDECX_VM_ONLY_SIGNER=$($sysSign.SignerCertificate.Thumbprint)"
          Write-Host 'UDECX_VM_ONLY_SIGNED_PACKAGE_VALIDATED'
          Write-Host 'Never install on physical Windows. Requires disposable VM snapshot.'
      - name: Upload VM-only experimental driver package
        uses: actions/upload-artifact@v4
        with:
          name: AvCam-UdeCx-VM-Enumeration-ONLY
          path: dist/AvCam-UdeCx-VM-Enumeration-ONLY/
          if-no-files-found: error
          retention-days: 7

name: UdeCx Controller Foundation (build only)

on:
  push:
    branches:
      - dev/manual-vhci
    paths:
      - 'research/udecx/**'
      - 'feeder/src/MediaFoundationFrameSource.cpp'
      - 'research/manual-vhci/tools/AvCamMfProbe.cpp'
      - '.github/workflows/udecx-foundation.yml'
      - 'packages.config'
  workflow_dispatch:

concurrency:
  group: udecx-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated UdeCx USB child contract
        shell: pwsh
        run: ./research/udecx/tests/static-contract.ps1
      - name: Validate VM acceptance script syntax and read-only safety
        shell: pwsh
        run: ./research/udecx/tests/vm-acceptance-contract-tests.ps1
      - name: Build and run portable UVC protocol tests
        shell: pwsh
        run: |
          cmake -S research/udecx/tests -B build/udecx-tests -A x64
          cmake --build build/udecx-tests --config Release
          ctest --test-dir build/udecx-tests -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'UdeCx protocol tests failed.' }
      - name: Restore WDK package cache
        id: wdk-cache
        uses: actions/cache/restore@v4
        with:
          path: packages
          key: wdk-sdk-x64-10.0.26100.6584-v2
      - name: Restore WDK and SDK packages
        run: nuget restore packages.config -PackagesDirectory packages -NonInteractive
      - name: Save WDK package cache
        if: steps.wdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages
          key: wdk-sdk-x64-10.0.26100.6584-v2
      - name: Add x64 MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Locate WDK build tools
        shell: pwsh
        run: |
          $stampInf = Get-ChildItem packages -Recurse -Filter stampinf.exe -File |
            Where-Object { $_.FullName -match '\\x64\\stampinf\.exe$' } |
            Select-Object -First 1
          if (-not $stampInf) { throw 'x64 stampinf.exe not found in WDK packages.' }
          $infVerifDll = Get-ChildItem packages -Recurse -Filter InfVerif.dll -File |
            Where-Object { $_.FullName -match '\\build\\[^\\]+\\bin\\x64\\InfVerif\.dll$' } |
            Select-Object -First 1
          $targetToolDir = $stampInf.Directory.FullName
          if ($infVerifDll) {
            $targetToolDir = $infVerifDll.Directory.FullName
            Copy-Item $stampInf.FullName (Join-Path $targetToolDir 'stampinf.exe') -Force
          }
          "StampInfToolPath=$targetToolDir\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $targetToolDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify UdeCx dependency exists
        shell: pwsh
        run: |
          $headers = @(Get-ChildItem packages -Recurse -Filter UdeCx.h -File -ErrorAction SilentlyContinue)
          $libs = @(Get-ChildItem packages -Recurse -Filter udecxstub.lib -File -ErrorAction SilentlyContinue)
          if ($headers.Count -eq 0) { throw 'UdeCx.h is missing from restored WDK.' }
          if ($libs.Count -eq 0) { throw 'udecxstub.lib is missing from restored WDK.' }
          $headers | Select-Object -First 2 FullName | Format-Table
          $libs | Select-Object -First 2 FullName | Format-Table
      - name: Compile UdeCx controller foundation
        shell: pwsh
        run: |
          msbuild research/udecx/AvCamUde.vcxproj /t:Rebuild /m /p:Configuration=Release /p:Platform=x64 /p:StampInfToolPath="$env:StampInfToolPath"
          if ($LASTEXITCODE -ne 0) { throw 'UdeCx compilation failed.' }
          $sys = Get-ChildItem research/udecx/x64/Release -Recurse -Filter AvCamUde.sys -File |
            Select-Object -First 1
          if (-not $sys -or $sys.Length -le 0) { throw 'UdeCx SYS missing or empty.' }
          Write-Host "UdeCx foundation compiled: $($sys.FullName)"
      - name: Analyze UdeCx controller with PREfast
        shell: pwsh
        run: |
          $output = & msbuild research/udecx/AvCamUde.vcxproj /t:Rebuild /m /p:Configuration=Release /p:Platform=x64 /p:StampInfToolPath="$env:StampInfToolPath" /p:RunCodeAnalysis=true /p:EnablePREfast=true 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { throw "UdeCx PREfast build failed: $exitCode" }
          $warnings = @($output | Select-String -Pattern '\bwarning\s+(C|CA|MSB)\d{4,5}\s*:' -CaseSensitive:$false)
          if ($warnings.Count -gt 0) {
            $warnings | ForEach-Object { Write-Host $_.Line }
            throw "UdeCx PREfast emitted $($warnings.Count) warning(s)"
          }
      - name: Compile isolated VM-only enumeration variant (never install or publish)
        shell: pwsh
        run: |
          # A separate WDK compile pass with an explicit test-only property.
          # This binary is NOT uploaded, signed for distribution, installed,
          # enabled on the runner, or used as the normal safety-gated build.
          msbuild research/udecx/AvCamUde.vcxproj /t:Rebuild /m /p:Configuration=Release /p:Platform=x64 /p:StampInfToolPath="$env:StampInfToolPath" /p:AvCamUdeVmEnumerationTest=I_UNDERSTAND_DISPOSABLE_VM_ONLY
          if ($LASTEXITCODE -ne 0) { throw 'VM-only UdeCx enumeration variant failed compilation.' }
          Write-Host "UDECX_VM_ENUMERATION_COMPILE_ONLY_PASSED"
      - name: Compile explicitly gated Windows 11 host video variant (NO INSTALL)
        shell: pwsh
        run: |
          # Validates both UdeCx autoplug and the actual native ISO dispatcher,
          # without loading a SYS on the build runner.
          msbuild research/udecx/AvCamUde.vcxproj /t:Rebuild /m /p:Configuration=Release /p:Platform=x64 /p:StampInfToolPath="$env:StampInfToolPath" /p:AvCamUdeHostVideoTest=I_ACCEPT_NATIVE_UDECX_ON_PRIMARY_WINDOWS
          if ($LASTEXITCODE -ne 0) { throw 'Host live-video UdeCx variant did not compile.' }
          Write-Host 'UDECX_HOST_VIDEO_COMPILE_ONLY_PASSED'
      # Intentionally NO upload-artifact or deployment step.
      # Neither the default nor VM-only build is installed as a camera.

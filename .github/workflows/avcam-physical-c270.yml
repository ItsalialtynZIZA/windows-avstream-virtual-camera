name: AvCam Physical Logitech C270 / OBS Device MFT (experimental)
on:
  workflow_dispatch:
  push:
    branches:
      - dev/manual-vhci
    paths:
      - 'research/physical-c270/**'
      - '.github/workflows/avcam-physical-c270.yml'
      - 'feeder/src/ObsSharedMemorySource.*'
      - 'feeder/src/MediaFoundationFrameSource.*'
      - 'research/udecx/tools/AvCamUdeMjpegEncoder.*'
permissions:
  contents: read
concurrency:
  group: avcam-physical-c270
  cancel-in-progress: true
jobs:
  validate-portable-endpoint-contract:
    name: Check C270 endpoint contract (Linux, no camera required)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute physical endpoint contract tests
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iresearch/physical-c270 \
            research/physical-c270/PhysicalEndpointAcceptanceTest.cpp \
            -o /tmp/avcam-c270-contract
          /tmp/avcam-c270-contract
      - name: Verify application-space dual-channel RAW/OBS router
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pthread -Iresearch/physical-c270 \
            research/physical-c270/AvCamDualChannelRouterTest.cpp -o /tmp/avcam-dual-router
          /tmp/avcam-dual-router
      - name: Verify per-client routing policy rejects unproven isolation
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iresearch/physical-c270 \
            research/physical-c270/AvCamPerClientRoutingPolicyTest.cpp \
            -o /tmp/avcam-client-policy
          /tmp/avcam-client-policy
      - name: Verify Sonix DMFT pin evidence cannot be inferred from source streams
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iresearch/physical-c270 \
            research/physical-c270/AvCamDmftTopologyGateTest.cpp \
            -o /tmp/avcam-dmft-topology-policy
          /tmp/avcam-dmft-topology-policy
      - name: Verify exact 30fps rationals and OEM media stream ID safety
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iresearch/physical-c270 \
            research/physical-c270/AvCamDmftMediaContractTest.cpp \
            -o /tmp/avcam-dmft-media-contract
          /tmp/avcam-dmft-media-contract
      - name: Verify mock adjacent MFT explicit pin links (no camera or OEM COM)
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -Iresearch/physical-c270 \
            research/physical-c270/AvCamDmftConnectedPinMapTest.cpp \
            -o /tmp/avcam-dmft-connected-pin-map
          /tmp/avcam-dmft-connected-pin-map
      - name: Verify unscoped MFT replacement is rejected by the compiler
        run: |
          echo '#include "AvCamMftBuildSafety.h"' > /tmp/avcam-safe-mft.cpp
          echo 'int main() { return 0; }' >> /tmp/avcam-safe-mft.cpp
          c++ -std=c++17 -Iresearch/physical-c270 /tmp/avcam-safe-mft.cpp -o /tmp/avcam-safe-mft
          /tmp/avcam-safe-mft
          if c++ -std=c++17 -Iresearch/physical-c270 -DAVCAM_EXPERIMENTAL_UNSCOPED_MFT_REPLACEMENT /tmp/avcam-safe-mft.cpp -o /tmp/avcam-unsafe-mft 2>/tmp/avcam-unsafe-error.log; then
            echo "ERROR: forbidden MFT mode unexpectedly compiled"
            exit 1
          fi
          grep -q 'Unscoped OBS replacement is prohibited' /tmp/avcam-unsafe-error.log
  validate-windows-c270-enumerator:
    name: Build and check C270 SetupAPI utility (Windows, no camera required)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Configure camera-independent tools
        shell: pwsh
        run: |
          cmake -S research/physical-c270/mock-fanout -B build/c270-identity -A x64
          if ($LASTEXITCODE -ne 0) { throw 'C270 identity configure failed' }
      - name: Compile SetupAPI enumerator and strict identity test
        shell: pwsh
        run: |
          cmake --build build/c270-identity --config Release --target AvCamEnumeratePhysicalC270 AvCamPhysicalEndpointAcceptanceTest AvCamIntegratedCameraFormats AvCamIntegratedNativeCaptureSmoke AvCamDmftComContract AvCamSonixComContract AvCamDmftTopologyGateTest AvCamDmftMediaContractTest AvCamDmftConnectedPinMapTest
          if ($LASTEXITCODE -ne 0) { throw 'C270 SetupAPI compilation failed' }
      - name: Run identity selftests without physical camera
        shell: pwsh
        run: |
          & ./build/c270-identity/Release/AvCamPhysicalEndpointAcceptanceTest.exe
          if ($LASTEXITCODE -ne 0) { throw "Physical endpoint contract test failed: $LASTEXITCODE" }
          & ./build/c270-identity/Release/AvCamIntegratedCameraFormats.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "Integrated Media Foundation type audit selftest failed: $LASTEXITCODE" }
          & ./build/c270-identity/Release/AvCamIntegratedNativeCaptureSmoke.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "Native Integrated Camera MJPEG smoke selftest failed: $LASTEXITCODE" }
          & ./build/c270-identity/Release/AvCamDmftComContract.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "AvCam Device MFT COM contract selftest failed: $LASTEXITCODE" }
          & ./build/c270-identity/Release/AvCamSonixComContract.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "Signed Sonix OEM COM probe fail-closed selftest failed: $LASTEXITCODE" }
          & ./build/c270-identity/Release/AvCamDmftTopologyGateTest.exe
          if ($LASTEXITCODE -ne 0) { throw "AvCam topology evidence gate failed: $LASTEXITCODE" }
          & ./build/c270-identity/Release/AvCamDmftMediaContractTest.exe
          if ($LASTEXITCODE -ne 0) { throw "Connected MFT media contract failed: $LASTEXITCODE" }
          & ./build/c270-identity/Release/AvCamDmftConnectedPinMapTest.exe
          if ($LASTEXITCODE -ne 0) { throw "Mock adjacent MFT pin mapping failed: $LASTEXITCODE" }
          & ./build/c270-identity/Release/AvCamEnumeratePhysicalC270.exe
          if ($LASTEXITCODE -ne 0) { throw "Read-only camera enumeration failed: $LASTEXITCODE" }
      - name: Publish read-only C270 PnP diagnostic separately
        uses: actions/upload-artifact@v4
        with:
          name: AvCam-C270-ReadOnly-PnP
          path: |
            build/c270-identity/Release/AvCamEnumeratePhysicalC270.exe
            build/c270-identity/Release/AvCamPhysicalEndpointAcceptanceTest.exe
          if-no-files-found: error
          retention-days: 14
  build-physical-c270:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Microsoft Device MFT reference implementation
        uses: actions/checkout@v4
        with:
          repository: microsoft/Windows-driver-samples
          ref: 2dc3fd3a0cc84a2933f2194e7ec0871584979071
          path: upstream
          sparse-checkout: avstream/sampledevicemft
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Restore Microsoft WIL headers
        shell: pwsh
        run: |
          nuget restore upstream/avstream/sampledevicemft/packages.config -PackagesDirectory upstream/packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'WIL NuGet restore failed' }
      - name: Adapt reference Device MFT for scoped AvCam OBS frames
        shell: pwsh
        run: |
          ./research/physical-c270/Adapt-Sample.ps1 -SampleDir upstream/avstream/sampledevicemft
      - name: Verify Device MFT safety header was staged
        shell: pwsh
        run: |
          $source = 'research/physical-c270/AvCamMftBuildSafety.h'
          $staged = 'upstream/avstream/sampledevicemft/AvCamMftBuildSafety.h'
          if (-not (Test-Path -LiteralPath $staged -PathType Leaf)) {
            throw 'Missing MFT safety header in staged Microsoft sample'
          }
          $a = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash
          $b = (Get-FileHash -LiteralPath $staged -Algorithm SHA256).Hash
          if ($a -ne $b) { throw 'Staged MFT safety header is out of date' }
          Write-Host 'AVCAM_MFT_SAFETY_HEADER_STAGED=PASS'
          # The Device MFT hook includes the routing policy. Ensure the
          # adapted upstream build uses the exact tested policy, not a stale
          # header from an older checkout.
          foreach ($name in @('AvCamPerClientRoutingPolicy.h','AvCamDmftMediaContract.h','AvCamPhysicalHook.cpp')) {
            $src = Join-Path 'research/physical-c270' $name
            $dst = Join-Path 'upstream/avstream/sampledevicemft' $name
            if (!(Test-Path -LiteralPath $dst -PathType Leaf)) {
              throw "Missing staged MFT component: $name"
            }
            if ((Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $dst -Algorithm SHA256).Hash) {
              throw "Stale MFT component staged: $name"
            }
          }
          Write-Host 'AVCAM_MFT_ROUTING_POLICY_AND_HOOK_STAGED=PASS'
          # The patched sample must emit runtime topology after reading
          # its predecessor IMFTransform counts, without enabling installation.
          $impl = Get-Content 'upstream/avstream/sampledevicemft/multipinmft.cpp' -Raw
          $callCount = $impl.Split([string[]]@('AvCamTraceDeviceMftTopology('), [StringSplitOptions]::None).Count - 1
          if ($callCount -ne 1) {
            throw "Missing or duplicate AvCam upstream topology telemetry: $callCount"
          }
          Write-Host 'AVCAM_DMFT_UPSTREAM_TOPOLOGY_TELEMETRY_STAGED=PASS'
          # A malformed predecessor could return enormous pin counts.
          # The guard must run BEFORE the sample allocates its ID arrays.
          $countCall = $impl.IndexOf('m_spSourceTransform->GetStreamCount( &inputStreams, &outputStreams )')
          $countGuard = $impl.IndexOf('CheckUpstreamPinCounts(inputStreams, outputStreams)')
          $allocation = $impl.IndexOf('pcOutputStreams = new (std::nothrow) DWORD[ outputStreams ]')
          if ($countCall -lt 0 -or $countGuard -le $countCall -or
              $allocation -le $countGuard -or
              !$impl.Contains('AvCamUpstreamTopologyRejected invalid_pin_count=1')) {
            throw 'Missing fail-closed predecessor count bound before allocation'
          }
          Write-Host 'AVCAM_DMFT_UPSTREAM_PIN_ALLOC_BOUND_STAGED=PASS'
          # Bound and verify telemetry from the upstream IMFDeviceTransform.
          $source = Get-Content 'upstream/avstream/sampledevicemft/multipinmft.cpp' -Raw
          $typeCalls = $source.Split([string[]]@('AvCamTraceUpstreamMediaContract('), [StringSplitOptions]::None).Count - 1
          if ($typeCalls -ne 1) {
            throw "Expected exactly one connected upstream media-type trace call; got $typeCalls"
          }
          $hook = Get-Content 'upstream/avstream/sampledevicemft/AvCamPhysicalHook.cpp' -Raw
          if (!$hook.Contains('GetOutputAvailableType(streamId, index,') -or
              !$hook.Contains('kMaxObservedTypesPerStream') -or
              !$hook.Contains('AuditStreamIds(outputIds, outputCount)') -or
              !$hook.Contains('chain_interop=NOT_VERIFIED')) {
            throw 'Missing bounded upstream type-enumeration guard and interop disclaimer'
          }
          Write-Host 'AVCAM_DMFT_UPSTREAM_MEDIA_CONTRACT_TELEMETRY_STAGED=PASS'
      - name: Self-test Sonix OEM chain preflight (Windows PowerShell 5.1, camera-free)
        shell: powershell
        run: |
          $script = (Resolve-Path 'research/physical-c270/AvCamSonixChainPreflight.ps1').Path
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $script, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Host $_ }
            throw 'Sonix preflight contains PowerShell syntax errors'
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Sonix preflight selftest failed' }
      - name: Validate bounded native capture wrapper in Windows PowerShell 5.1 (no camera)
        shell: powershell
        run: |
          $path = 'research/physical-c270/Run-AvCamIntegratedNativeCaptureSmoke.ps1'
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Host $_ }
            throw 'Integrated native capture wrapper syntax failed'
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $path -WrapperSelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Bounded wrapper process and exit-code regression failed' }
      - name: Validate OEM-preserving Sonix chain planner (Windows PowerShell 5.1, read-only)
        shell: powershell
        run: |
          $script = 'research/physical-c270/AvCamSonixChainPlan.ps1'
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $script).Path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Host $_ }
            throw 'Sonix chain planner has syntax errors'
          }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Sonix chain planner selftest failed' }
          Write-Host 'AVCAM_SONIX_CHAIN_PLAN_CI=PASS'
      - name: Validate transactional Sonix DMFT rollback in isolated HKCU sandbox
        shell: powershell
        run: |
          $script = 'research/physical-c270/AvCamSonixChainTransaction.ps1'
          $tokens = $null
          $syntax = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $script).Path, [ref]$tokens, [ref]$syntax)
          if ($syntax.Count -gt 0) {
            $syntax | ForEach-Object { Write-Host $_ }
            throw 'Sonix chain transaction parser failure'
          }
          $out = @(& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -SelfTest)
          $exit = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($exit -ne 0) { throw "Sonix rollback simulation failed with exit $exit" }
          foreach ($marker in @(
            'AVCAM_SONIX_TRANSACTION_NORMAL_ROLLBACK_PASS',
            'AVCAM_SONIX_TRANSACTION_FAULT_RECOVERY_PASS',
            'AVCAM_SONIX_TRANSACTION_CONCURRENT_GUARD_PASS',
            'AVCAM_SONIX_TRANSACTION_REGTYPE_GUARD_PASS',
            'AVCAM_SONIX_TRANSACTION_SELFTEST_PASS'
          )) {
            if ($out -notcontains $marker) { throw "Missing transaction marker: $marker" }
          }
          $disabled = @(& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script)
          if ($LASTEXITCODE -ne 0 -or
              $disabled -notcontains 'AVCAM_SONIX_TRANSACTION_INSTALL=BLOCKED') {
            throw 'Sonix chain transaction unexpectedly allows production install'
          }
      - name: Test physical Logitech registry preflight without accessing protected subkeys
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File research/physical-c270/RegistryPreflightTest.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Physical Logitech registry preflight regression failed' }
      - name: Validate read-only C270 diagnostics in Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($filename in @('AvCamPhysicalDiagnostics.ps1','AvCamPhysicalDiagnostic.ps1')) {
            $script = (Resolve-Path ("research/physical-c270/" + $filename)).Path
            $tokens = $null
            $errors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile(
              $script, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; throw "Diagnostics parse failed for $filename" }
            $unsafe = @($ast.FindAll({
              param($n)
              $n -is [System.Management.Automation.Language.CommandAst] -and
              $n.GetCommandName() -in @(
                'Set-ItemProperty','New-ItemProperty','Remove-ItemProperty',
                'Set-Item','New-Item','Remove-Item','Start-Process','Stop-Process',
                'Stop-Service','Restart-Service','Set-PnpDeviceProperty')
            },$true))
            if ($unsafe.Count -gt 0) { throw "Diagnostics contains prohibited state-changing commands: $filename" }
          }
          Write-Host 'AVCAM_PHYSICAL_C270_DIAGNOSTICS_READONLY_PARSE_PASSED'
          $tracePath = (Resolve-Path 'research/physical-c270/AvCamPhysicalCaptureEtw.ps1').Path
          $tokens = $null
          $errors = $null
          $traceAst = [System.Management.Automation.Language.Parser]::ParseFile(
            $tracePath, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw 'ETW capture script parse failed' }
          # Unlike the read-only reports above, this tool creates and stops
          # a temporary ETW trace session and writes only trace output files.
          Write-Host 'AVCAM_PHYSICAL_C270_ETW_CAPTURE_PARSE_PASSED'

      - name: Verify MFT diagnostic event contract and fail-closed policy
        shell: powershell
        run: |
          $hook = Get-Content 'research/physical-c270/AvCamPhysicalHook.cpp' -Raw
          $adapt = Get-Content 'research/physical-c270/Adapt-Sample.ps1' -Raw
          $capture = Get-Content 'research/physical-c270/AvCamPhysicalCaptureEtw.ps1' -Raw
          $safety = Get-Content 'research/physical-c270/AvCamMftBuildSafety.h' -Raw
          foreach ($marker in @('AvCamQueueNegotiated','AvCamQueueRemoved','AvCamMultiAppSafePassThrough')) {
            if (!$hook.Contains($marker)) { throw "Missing MFT event: $marker" }
          }
          if (!$adapt.Contains('AvCamDeviceMftInitialize')) { throw 'Missing Device MFT initialization event' }
          if (!$adapt.Contains('AvCamDeviceMftPinTopology')) { throw 'Missing connected Device MFT topology event injection' }
          $stagedMft = Get-Content 'upstream/avstream/sampledevicemft/multipinmft.cpp' -Raw
          if (!$stagedMft.Contains('AvCamDeviceMftPinTopology')) {
            throw 'Adapted Device MFT implementation lacks the stream topology event'
          }
          foreach ($marker in @(
            'AvCamQueueNegotiated',
            'AvCamDeviceMftInitialize',
            'AvCamDeviceMftPinTopology',
            'AVCAM_DMFT_CONNECTED_UPSTREAM_IDENTITY=UNKNOWN',
            'AVCAM_SONIX_PIN_INTEROP=NOT_VERIFIED',
            'AVCAM_SONIX_CHAIN_INSTALL=BLOCKED',
            'EVIDENCE_LEVEL=DEVICE_MFT_ONLY'
          )) {
            if (!$capture.Contains($marker)) { throw "Trace parser lacks event/contract: $marker" }
          }
          if (!$safety.Contains('#error "Unscoped OBS replacement is prohibited')) {
            throw 'Unsafe Device MFT substitution compile guard removed'
          }
          Write-Host 'AVCAM_MFT_DIAGNOSTIC_CONTRACT_PASS'
      - name: Validate release controller and one-click installer
        shell: powershell
        run: |
          $scripts = @('AvCamPhysicalControl.ps1','AvCamSetup.ps1')
          foreach ($name in $scripts) {
            $path = (Resolve-Path ("research/physical-c270/" + $name)).Path
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "Syntax failure in $name : $errors" }
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File research/physical-c270/AvCamPhysicalControl.ps1 -Action Status
          if ($LASTEXITCODE -ne 0) { throw 'AvCam release controller status failed in clean Windows' }
          Write-Host 'AVCAM_C270_RELEASE_CONTROLLER_WINDOWS_POWERSHELL_PASSED'
      - name: Validate the dual physical-camera red-scene safety preflight
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File research/physical-c270/AvCamDualCameraRedPreflight.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw 'Dual-camera preflight selftest failed' }
          Write-Host 'AVCAM_TWO_CAMERA_RED_PREFLIGHT_CI_PASS'
      - name: Regression check task identity against localized short account names
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File research/physical-c270/TaskIdentityTest.ps1
          if ($LASTEXITCODE -ne 0) { throw 'AvCam Task Scheduler principal ownership regression failed' }
      - name: Compile and run camera-independent mock capture fanout
        shell: pwsh
        run: |
          cmake -S research/physical-c270/mock-fanout -B build/mock-fanout -A x64
          if ($LASTEXITCODE -ne 0) { throw 'Mock fanout configure failed' }
          cmake --build build/mock-fanout --config Release
          if ($LASTEXITCODE -ne 0) { throw 'Mock fanout compilation failed' }
          & ./build/mock-fanout/Release/AvCamEnumeratePhysicalC270.exe
          if ($LASTEXITCODE -ne 0) { throw 'Read-only SetupAPI enumerator failed' }
          & ./build/mock-fanout/Release/AvCamPhysicalEndpointAcceptanceTest.exe
          if ($LASTEXITCODE -ne 0) { throw 'Strict original physical endpoint regression failed' }
          $obsRouter = Start-Process -FilePath (Resolve-Path ./build/mock-fanout/Release/AvCamRouterObsSmoke.exe).Path -ArgumentList '--obs' -Wait -PassThru -NoNewWindow
          if ($obsRouter.ExitCode -ne 8) { throw "Router OBS absent-source contract failed: $($obsRouter.ExitCode)" }
          if (!(Test-Path -LiteralPath './build/mock-fanout/Release/AvCamRouterPhysicalRawObs.exe' -PathType Leaf)) {
            throw 'Physical C270 and OBS router diagnostic executable was not compiled'
          }
          # A malformed CLI must fail without opening any camera. This checks
          # the executable entry point on hosted Windows CI without hardware.
          & ./build/mock-fanout/Release/AvCamRouterPhysicalRawObs.exe --invalid
          if ($LASTEXITCODE -ne 9) { throw "Router invalid-option contract failed: $LASTEXITCODE" }
          # Strongly typed list prevents PowerShell's implicit flattening
          # of nested arrays, even for vectors with only one argument.
          $invalidRouterArguments = [System.Collections.Generic.List[string[]]]::new()
          $invalidRouterArguments.Add([string[]]@('--frames','0','--continuous'))
          $invalidRouterArguments.Add([string[]]@('--frames','abc','--continuous'))
          $invalidRouterArguments.Add([string[]]@('--frames','-1','--continuous'))
          $invalidRouterArguments.Add([string[]]@('--frames','+3','--continuous'))
          $invalidRouterArguments.Add([string[]]@('--frames','10000001','--continuous'))
          $invalidRouterArguments.Add([string[]]@('--frames','2','--frames','3','--continuous'))
          $invalidRouterArguments.Add([string[]]@('--frames','2'))
          $invalidRouterArguments.Add([string[]]@('--continuous','--continuous'))
          foreach ($argsToCheck in $invalidRouterArguments) {
            & ./build/mock-fanout/Release/AvCamRouterPhysicalRawObs.exe @argsToCheck
            if ($LASTEXITCODE -ne 9) {
              throw "Router CLI rejection failed ($($argsToCheck -join ' ')): $LASTEXITCODE"
            }
          }
          Write-Host 'AVCAM_ROUTER_CLI_VALIDATION_PASSED'
          & ./build/mock-fanout/Release/AvCamRouterRunPolicyTest.exe
          if ($LASTEXITCODE -ne 0) { throw 'AvCam bounded run policy test failed' }
          & ./build/mock-fanout/Release/AvCamRouterDiagnosticsTest.exe
          if ($LASTEXITCODE -ne 0) { throw 'RAW/OBS fps and sample freshness regression failed' }
          $ipcOutput = @(& ./build/mock-fanout/Release/AvCamRouterIpcProbe.exe --self-test)
          $ipcExitCode = $LASTEXITCODE
          $ipcOutput | ForEach-Object { Write-Host $_ }
          if ($ipcExitCode -ne 0) { throw "Independent RAW/OBS IPC contract failed: $ipcExitCode" }
          foreach ($marker in @(
            'AVCAM_ROUTER_IPC_SELFTEST_PASS',
            'AVCAM_ROUTER_IPC_RESTART_WITH_LIVE_READER_PASS',
            'AVCAM_ROUTER_IPC_CONCURRENT_WRITER_REJECTED=1'
          )) {
            if ($ipcOutput -notcontains $marker) { throw "IPC restart regression marker missing: $marker" }
          }
          & ./build/mock-fanout/Release/AvCamRouterIpcProbe.exe --invalid
          if ($LASTEXITCODE -ne 9) { throw 'IPC consumer invalid argument rejection failed' }
          & ./build/mock-fanout/Release/AvCamFeederIpcSourceTest.exe
          if ($LASTEXITCODE -ne 0) { throw "IPC V2 feeder frame integration failed: $LASTEXITCODE" }
          & ./build/mock-fanout/Release/AvCamVirtualReadinessTest.exe
          if ($LASTEXITCODE -ne 0) { throw "Virtual camera readiness classification failed: $LASTEXITCODE" }
          & ./build/mock-fanout/Release/AvCamMfColorTest.exe
          if ($LASTEXITCODE -ne 0) { throw 'Media Foundation BGRA/NV12 conversion regression failed' }
          $mfSourceDll = (Resolve-Path './build/mock-fanout/Release/AvCamMfSource.dll').Path
          & ./build/mock-fanout/Release/AvCamMfSourceSmoke.exe $mfSourceDll
          if ($LASTEXITCODE -ne 0) { throw "Unregistered camera COM DLL activation and lifecycle failed: $LASTEXITCODE" }
          # Regression for 0xC00D3E85 on real Windows: IMFMediaSource must
          # stay usable after its IMFActivate wrapper is released.
          & ./build/mock-fanout/Release/AvCamMfActivationLifetimeSmoke.exe $mfSourceDll
          if ($LASTEXITCODE -ne 0) { throw "Media Foundation activation/source lifetime regression failed: $LASTEXITCODE" }
          Write-Host 'AVCAM_MF_ACTIVATION_LIFETIME_WINDOWS_ACCEPTANCE_PASS'
          # Time-bound the concurrency regression: a COM deadlock must fail
          # CI rather than leave a Windows runner hung indefinitely.
          $stress = (Resolve-Path './build/mock-fanout/Release/AvCamMfConcurrentShutdownSmoke.exe').Path
          $si = [System.Diagnostics.ProcessStartInfo]::new()
          $si.FileName = $stress
          $si.Arguments = '"' + $mfSourceDll + '"'
          $si.UseShellExecute = $false
          $si.CreateNoWindow = $true
          $si.RedirectStandardOutput = $true
          $si.RedirectStandardError = $true
          $proc = [System.Diagnostics.Process]::new()
          $proc.StartInfo = $si
          try {
            if (-not $proc.Start()) { throw 'Could not start MF concurrent shutdown regression' }
            $stdoutTask = $proc.StandardOutput.ReadToEndAsync()
            $stderrTask = $proc.StandardError.ReadToEndAsync()
            if (-not $proc.WaitForExit(25000)) {
              $proc.Kill()
              [void]$proc.WaitForExit(3000)
              throw 'MF concurrent shutdown regression timeout / possible deadlock'
            }
            $stdout = $stdoutTask.GetAwaiter().GetResult()
            $stderr = $stderrTask.GetAwaiter().GetResult()
            Write-Host $stdout
            if ($stderr) { Write-Warning $stderr }
            if ($proc.ExitCode -ne 0 -or $stdout -notmatch 'AVCAM_MF_CONCURRENT_SHUTDOWN_NO_CAMERA_PASS') {
              throw "MF concurrency regression failed: exit $($proc.ExitCode)"
            }
          } finally {
            $proc.Dispose()
          }
          Write-Host 'AVCAM_MF_CONCURRENT_SHUTDOWN_WINDOWS_ACCEPTANCE_PASS'
          $pipeBridge = (Resolve-Path './build/mock-fanout/Release/AvCamMfObsPipeBridge.exe').Path
          & ./build/mock-fanout/Release/AvCamMfPipeSmoke.exe $pipeBridge
          if ($LASTEXITCODE -ne 0) { throw "OBS-only cross-session pipe process test failed: $LASTEXITCODE" }
          # Probe is not allowed to install a temporary SCM service
          # without an explicit command-line consent flag.
          $serviceProbe = (Resolve-Path './build/mock-fanout/Release/AvCamMfLocalServiceProbe.exe').Path
          $serviceStatus = @(& $serviceProbe --status)
          $serviceCode = $LASTEXITCODE
          $serviceStatus | ForEach-Object { Write-Host $_ }
          if ($serviceCode -ne 0 -or
              $serviceStatus -notcontains 'AVCAM_LOCALSERVICE_PROBE=AVAILABLE_NOT_EXECUTED') {
            throw 'Windows LocalService probe status did not run safely'
          }
          & $serviceProbe --probe
          if ($LASTEXITCODE -ne 2) {
            throw 'LocalService diagnostic accepted a service creation attempt without consent'
          }
          Write-Host 'AVCAM_LOCALSERVICE_DIAGNOSTIC_FAIL_CLOSED_PASS'
          Write-Host 'AVCAM_MF_PIPE_BROKER_WINDOWS_ACCEPTANCE_PASS'
          # Full unregistered COM integration: actual MEMediaSample payloads
          # must contain correctly converted OBS pixels, never physical RAW.
          & ./build/mock-fanout/Release/AvCamMfEndToEndSmoke.exe $mfSourceDll $pipeBridge
          if ($LASTEXITCODE -ne 0) { throw "MF end-to-end OBS-only sample verification failed: $LASTEXITCODE" }
          Write-Host 'AVCAM_MF_END_TO_END_WINDOWS_ACCEPTANCE_PASS'
          # No AvCam COM media-source is registered on a clean Windows runner.
          # MFCreateVirtualCamera availability is read-only; no device created.
          $softwareCamera = (Resolve-Path './build/mock-fanout/Release/AvCamSoftwareCameraControl.exe').Path
          $softwarePreflight = @(& $softwareCamera --preflight)
          $softwareExit = $LASTEXITCODE
          $softwarePreflight | ForEach-Object { Write-Host $_ }
          if ($softwareExit -ne 6 -or
              $softwarePreflight -notmatch '^AVCAM_MF_VIRTUAL_CAMERA_API=[01] media_source_registered=0 current_user_only=1$') {
            throw "Win11 software camera preflight must fail closed without registered COM source"
          }
          # A real Windows 11 Frame Server hang was reported by WER.
          # Refuse live session without a distinct risk-acknowledgement flag,
          # regardless of whether COM registration exists.
          $quarantined = @(& $softwareCamera --session)
          $quarantined | ForEach-Object { Write-Host $_ }
          if ($LASTEXITCODE -ne 2 -or
              $quarantined -notcontains 'AVCAM_SOFTWARE_CAMERA_FRAMESERVER_HANG_QUARANTINED') {
            throw 'Windows camera live session must be quarantined after the Frame Server hang'
          }
          & $softwareCamera --session --accept-unstable-frame-server
          if ($LASTEXITCODE -ne 6) { throw 'Software camera session created without registered COM source' }
          Write-Host 'AVCAM_WIN11_FRAMESERVER_HANG_QUARANTINE_PASS'
          & $softwareCamera --invalid
          if ($LASTEXITCODE -ne 2) { throw 'Software camera CLI accepted invalid arguments' }
          Write-Host 'AVCAM_WIN11_SOFTWARE_CAMERA_CONTROLLER_PREFLIGHT_PASS'
          # Exercise the ACTUAL packaged feeder, not only its source class,
          # against a different Windows process publishing synthetic OBS.
          # No AVStream driver, Logitech camera, or OBS Studio is needed.
          $feederBinary = (Resolve-Path './build/mock-fanout/avcam-feeder/Release/AvCamFeeder.exe').Path
          $fakeWriterBinary = (Resolve-Path './build/mock-fanout/Release/AvCamRouterIpcProcessTest.exe').Path
          $sinkProbe = @(& $feederBinary --check-sink)
          $sinkCode = $LASTEXITCODE
          $sinkProbe | ForEach-Object { Write-Host $_ }
          if ($sinkCode -ne 6 -or $sinkProbe -notcontains 'AVCAM_VIRTUAL_SINK_PRESENT=0 sink_interfaces=0') {
            throw "Fresh Windows runner unexpectedly has a private AvCam sink: $sinkCode"
          }
          $virtualCameraReport = @(& $feederBinary --check-virtual-camera)
          $virtualCameraCode = $LASTEXITCODE
          $virtualCameraReport | ForEach-Object { Write-Host $_ }
          if ($virtualCameraCode -ne 6 -or
              $virtualCameraReport -notcontains 'AVCAM_VIRTUAL_CAMERA_READINESS=ABSENT ks_sinks=0 mf_name_matches=0') {
            throw "Fresh Windows runner unexpectedly enumerates a separate AvCam virtual camera: $virtualCameraCode"
          }
          Write-Host 'AVCAM_VIRTUAL_CAMERA_MF_READONLY_PREFLIGHT_PASS'
          $fakeObs = $null
          try {
            $fakeObs = Start-Process -FilePath $fakeWriterBinary -ArgumentList @('--writer','obs','155') -PassThru -NoNewWindow
            Start-Sleep -Milliseconds 650
            $fakeObs.Refresh()
            if ($fakeObs.HasExited) { throw "Synthetic OBS publisher exited: $($fakeObs.ExitCode)" }
            $actualFeederProbe = @(& $feederBinary --source avcam-ipc-obs --check-source --seconds 3)
            $actualFeederCode = $LASTEXITCODE
            $actualFeederProbe | ForEach-Object { Write-Host $_ }
            if ($actualFeederCode -ne 0) { throw "Real feeder IPC check failed: $actualFeederCode" }
            $metrics = @($actualFeederProbe | Where-Object { $_ -match '^AVCAM_IPC_CHECK frames=([0-9]+)' })
            if ($metrics.Count -ne 1) { throw 'Real feeder emitted no IPC metrics' }
            if ($metrics[0] -match '^AVCAM_IPC_CHECK frames=([0-9]+)') {
              $realFrameCount = [int]$Matches[1]
            } else {
              throw 'Real feeder returned a malformed IPC frame count'
            }
            if ($realFrameCount -lt 15) {
              throw "Real feeder received only $realFrameCount frames in 3 seconds"
            }
            Write-Host 'AVCAM_FEEDER_REAL_EXE_IPC_PROCESS_PASS'
          } finally {
            if ($fakeObs) {
              $fakeObs.Refresh()
              if (-not $fakeObs.HasExited) { Stop-Process -Id $fakeObs.Id -Force -ErrorAction SilentlyContinue }
              $fakeObs.Dispose()
            }
          }
          # Spawn separate synthetic Windows publishers, kill one and restart
          # it while the consumer retains its read-only mapped view.
          $ipcProcessOutput = @(& ./build/mock-fanout/Release/AvCamRouterIpcProcessTest.exe --self-test)
          $ipcProcessExit = $LASTEXITCODE
          $ipcProcessOutput | ForEach-Object { Write-Host $_ }
          if ($ipcProcessExit -ne 0) {
            throw "Cross-process IPC crash/restart regression failed: $ipcProcessExit"
          }
          foreach ($marker in @(
            'AVCAM_IPC_PROCESS_CONCURRENT_OWNER_REJECTED=1',
            'AVCAM_IPC_PROCESS_CRASH_RESTART_PASS',
            'AVCAM_IPC_PROCESS_LIVE_READER_REATTACHED=1',
            'AVCAM_IPC_PROCESS_RAW_SURVIVES_OBS_CRASH=1'
          )) {
            if ($ipcProcessOutput -notcontains $marker) {
              throw "Cross-process IPC regression marker missing: $marker"
            }
          }
          & ./build/mock-fanout/Release/AvCamPreviewSelectionTest.exe
          if ($LASTEXITCODE -ne 0) { throw 'Preview source selection and freshness policy failed' }
          & ./build/mock-fanout/Release/AvCamAsyncObsWorkerTest.exe
          if ($LASTEXITCODE -ne 0) { throw 'OBS capture thread does not preserve RAW independence' }
          & ./build/mock-fanout/Release/AvCamRouterPhysicalRawObs.exe --independent-obs
          if ($LASTEXITCODE -ne 9) { throw 'Independent OBS must require continuous mode' }
          & ./build/mock-fanout/Release/AvCamRouterPhysicalRawObs.exe --continuous --raw-only --independent-obs
          if ($LASTEXITCODE -ne 9) { throw 'Independent OBS cannot accompany raw-only mode' }
          # GUI subsystem executables can return control to PowerShell before
          # process exit. Wait explicitly and validate the real exit code.
          $previewTest = Start-Process -FilePath (Resolve-Path ./build/mock-fanout/Release/AvCamRouterPreview.exe).Path -ArgumentList '--self-test' -Wait -PassThru
          if ($previewTest.ExitCode -ne 0) { throw "Native Windows preview selftest failed: $($previewTest.ExitCode)" }
          & ./build/mock-fanout/Release/AvCamDualChannelRouterTest.exe
          if ($LASTEXITCODE -ne 0) { throw 'AvCam dual-channel RAW/OBS routing failed' }
          & ./build/mock-fanout/Release/AvCamPerClientIsolationTest.exe
          if ($LASTEXITCODE -ne 0) { throw 'Strict native per-consumer RAW/OBS isolation simulation failed' }
          & ./build/mock-fanout/Release/AvCamMockFanout.exe
          if ($LASTEXITCODE -ne 0) { throw 'Mock fanout runtime selftest failed' }
          & ./build/mock-fanout/Release/AvCamMockIpcFanout.exe
          if ($LASTEXITCODE -ne 0) { throw 'Mock IPC fanout selftest failed' }
          & ./build/mock-fanout/Release/AvCamMockFrameIpc.exe
          if ($LASTEXITCODE -ne 0) { throw 'Full-frame BGRA IPC selftest failed' }
          # CI has no running OBS. The live-source mode must fail explicitly rather than silently generating synthetic frames.
          $obsProbe = Start-Process -FilePath (Resolve-Path ./build/mock-fanout/Release/AvCamMockFrameIpc.exe).Path -ArgumentList '--obs' -Wait -PassThru -NoNewWindow
          if ($obsProbe.ExitCode -ne 8) { throw "OBS missing-source contract failed (expected 8, got $($obsProbe.ExitCode))" }
      - name: Compile user-mode OBS bridge and device MFT COM DLL
        shell: pwsh
        run: |
          $s = ((Resolve-Path upstream/avstream/sampledevicemft).Path -replace '\\', '/')
          $wil = ((Resolve-Path upstream/packages/Microsoft.Windows.ImplementationLibrary.1.0.210204.1/include).Path -replace '\\', '/')
          cmake -S research/physical-c270 -B build/physical-c270 -A x64 -DMICROSOFT_DMFT_DIR="$s" -DMICROSOFT_WIL_INCLUDE="$wil"
          if ($LASTEXITCODE -ne 0) { throw 'Physical C270 CMake configure failed' }
          cmake --build build/physical-c270 --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Physical C270 compile failed' }

      - name: Build isolated dual-camera Device MFT lab (not installed)
        shell: pwsh
        run: |
          $sample = ((Resolve-Path upstream/avstream/sampledevicemft).Path -replace '\\', '/')
          $wil = ((Resolve-Path upstream/packages/Microsoft.Windows.ImplementationLibrary.1.0.210204.1/include).Path -replace '\\', '/')
          cmake -S research/physical-c270 -B build/physical-c270-lab -A x64 -DAVCAM_DUAL_CAMERA_LAB=ON -DMICROSOFT_DMFT_DIR="$sample" -DMICROSOFT_WIL_INCLUDE="$wil"
          if ($LASTEXITCODE -ne 0) { throw 'Dual-camera lab configure failed' }
          cmake --build build/physical-c270-lab --config Release --target AvCamPhysicalDeviceMft --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Dual-camera lab DLL compilation failed' }
          if (!(Test-Path ./build/physical-c270-lab/Release/AvCamDualCameraDeviceMft.dll)) { throw 'Dedicated lab DLL missing' }
          Write-Host 'AVCAM_DUAL_CAMERA_MFT_LAB_BUILD_PASS_NO_REGISTRATION'

      - name: Inspect AvCam Device MFT COM interfaces without registration
        shell: pwsh
        run: |
          $probe = (Resolve-Path 'build/physical-c270/Release/AvCamDmftComContract.exe').Path
          $dll = (Resolve-Path 'build/physical-c270-lab/Release/AvCamDualCameraDeviceMft.dll').Path
          $psi = [System.Diagnostics.ProcessStartInfo]::new()
          $psi.FileName = $probe
          $psi.Arguments = '--inspect-dll "' + $dll + '"'
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $p = [System.Diagnostics.Process]::new()
          $p.StartInfo = $psi
          $started = $false
          try {
            $started = $p.Start()
            if (-not $started) { throw 'Unable to launch unregistered Device MFT inspection' }
            $outTask = $p.StandardOutput.ReadToEndAsync()
            $errTask = $p.StandardError.ReadToEndAsync()
            if (-not $p.WaitForExit(15000)) {
              $p.Kill()
              [void]$p.WaitForExit(3000)
              throw 'Device MFT COM inspection timed out without touching installed cameras'
            }
            $output = $outTask.GetAwaiter().GetResult()
            $errorText = $errTask.GetAwaiter().GetResult()
            Write-Host $output
            if ($errorText) { Write-Warning $errorText }
            if ($p.ExitCode -ne 0 -or
                $output -notmatch 'AVCAM_DMFT_REQUIRED_COM_INTERFACES=PASS') {
              throw "Device MFT required COM interface audit failed: $($p.ExitCode)"
            }
          } finally {
            if ($started -and -not $p.HasExited) {
              try { $p.Kill() } catch {}
            }
            $p.Dispose()
          }


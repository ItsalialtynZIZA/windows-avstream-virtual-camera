name: Manual vHCI Research

on:
  push:
    branches:
      - dev/manual-vhci
    paths:
      - 'research/manual-vhci/**'
      - '.github/workflows/manual-vhci.yml'
      - 'packages.config'
  pull_request:
    paths:
      - 'research/manual-vhci/**'
      - '.github/workflows/manual-vhci.yml'
      - 'packages.config'

concurrency:
  group: manual-vhci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-manual-vhci:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Add x64 MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Restore WDK package cache
        id: wdk-cache
        uses: actions/cache/restore@v4
        with:
          path: packages
          key: wdk-sdk-x64-10.0.26100.6584-v2

      - name: Restore WDK and SDK packages
        run: nuget restore packages.config -PackagesDirectory packages -NonInteractive

      - name: Save WDK package cache
        if: steps.wdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: packages
          key: wdk-sdk-x64-10.0.26100.6584-v2

      - name: Locate WDK build tools
        shell: pwsh
        run: |
          $stampInf = Get-ChildItem packages -Recurse -Filter stampinf.exe -File |
            Where-Object { $_.FullName -match '\\x64\\stampinf\.exe$' } |
            Select-Object -First 1
          if (-not $stampInf) { throw 'x64 stampinf.exe was not found in restored WDK packages.' }

          $infVerifDll = Get-ChildItem packages -Recurse -Filter InfVerif.dll -File |
            Where-Object { $_.FullName -match '\\build\\[^\\]+\\bin\\x64\\InfVerif\.dll$' } |
            Select-Object -First 1

          $targetToolDir = $stampInf.Directory.FullName
          if ($infVerifDll) {
            $targetToolDir = $infVerifDll.Directory.FullName
            $stagedStampInf = Join-Path $targetToolDir 'stampinf.exe'
            Copy-Item $stampInf.FullName $stagedStampInf -Force
          }

          "StampInfToolPath=$targetToolDir\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $targetToolDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build manual vHCI driver
        shell: pwsh
        run: |
          msbuild research/manual-vhci/driver/AvCamBus.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:StampInfToolPath="$env:StampInfToolPath"

      - name: Show outputs
        shell: pwsh
        run: |
          Get-ChildItem research/manual-vhci/driver -Recurse -Include AvCamBus.sys,AvCamBus.inf,AvCamBus.cat,AvCamBus.cer |
            Select-Object FullName,Length

      - name: Analyze with PREfast
        shell: pwsh
        run: |
          $output = & msbuild research/manual-vhci/driver/AvCamBus.vcxproj /t:Rebuild /m /p:Configuration=Release /p:Platform=x64 /p:StampInfToolPath="$env:StampInfToolPath" /p:RunCodeAnalysis=true /p:EnablePREfast=true 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            throw "PREfast MSBuild failed with exit code $exitCode."
          }

          $warnings = @($output | Select-String -Pattern '\bwarning\s+(C|CA|MSB)\d{4,5}\s*:' -CaseSensitive:$false)
          if ($warnings.Count -gt 0) {
            $warnings | ForEach-Object { Write-Host $_.Line }
            throw "PREfast emitted $($warnings.Count) warning(s)."
          }

      - name: Upload manual vHCI package
        uses: actions/upload-artifact@v4
        with:
          name: AvCam-manual-vhci-test-x64
          if-no-files-found: error
          path: |
            research/manual-vhci/driver/x64/Release/AvCamBus/**
            research/manual-vhci/driver/x64/Release/AvCamBus.cer
            research/manual-vhci/README.md
